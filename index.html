<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Die Farbe der Browserleiste am Handy. Sie soll zum Hintergrund
         passen: wenn Matilda --hintergrund in styles.css aendert, gehoert
         diese Zeile mitgeaendert. -->
    <meta name="theme-color" content="#9f5de4" />

    <!-- Das Bildchen im Browser-Tab. Es ist keine Datei, sondern ein Emoji,
         das direkt hier steht -- deshalb gibt es nichts hochzuladen.
         MATILDA: das Emoji zwischen > und < austauschen, speichern, Seite
         neu laden. Die %22 sind Anfuehrungszeichen, die hier so geschrieben
         werden muessen. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>"
    />

    <!-- Damit die App aufs Handy gelegt werden kann und dort ohne
         Adressleiste startet. Der eigentliche Grund steht in
         roadmap/implemented/feature-homebildschirm-2026-08-29-1327.md: iOS loescht den
         Speicher nach sieben Tagen ohne Benutzung -- Apps auf dem
         Homebildschirm sind davon ausgenommen. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vokabeln" />

    <!-- Das Bild fuer den Homebildschirm. Anders als das Favicon oben muss
         das eine echte Datei sein -- iOS kann hier kein Emoji.
         MATILDA: Wenn du ein anderes Bild willst, tausch die drei PNGs in
         public/ aus. Quadratisch, und die Groesse im Dateinamen einhalten. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Vokabelkarten</title>
  </head>
  <body>
    <!-- Der Knopf oben rechts und die Lade dazu. Sie liegt ueber allem und
         ist zu, solange sie niemand oeffnet -- die Karte bleibt leer. -->
    <button
      id="menue-knopf"
      class="menue-knopf"
      type="button"
      aria-expanded="false"
      aria-controls="menue"
    >
      <span class="sr-only">Menü öffnen</span>
      <!-- Drei Striche, gezeichnet statt getippt: das Zeichen dafuer gibt es
           nicht auf jedem Geraet, eine Linie schon. -->
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <div id="menue-schatten" class="menue-schatten"></div>

    <aside id="menue" class="menue" aria-label="Menü">
      <button id="menue-zu" class="menue-knopf menue__zu" type="button">
        <span class="sr-only">Menü schließen</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <h2 class="menue__titel">Einstellungen</h2>

      <label class="menue__zeile" for="toene">
        <input id="toene" type="checkbox" checked />
        <span>Töne</span>
      </label>

      <h2 class="menue__titel">Ansehen</h2>

      <a class="menue__zeile menue__zeile--link" href="fortschritt.html">
        Dein Fortschritt
        <span aria-hidden="true" class="menue__pfeil">→</span>
      </a>

      <a class="menue__zeile menue__zeile--link" href="fleiss.html">
        Dein Fleiß
        <span aria-hidden="true" class="menue__pfeil">→</span>
      </a>
    </aside>

    <main class="buehne">
      <h1 class="titel">Vokabelkarten</h1>

      <!-- Richtungswahl. Radios statt Knöpfe, damit klar ist:
           genau eine der beiden Möglichkeiten gilt. -->
      <fieldset id="richtung" class="richtung">
        <legend class="sr-only">In welche Richtung möchtest du üben?</legend>
        <label class="richtung__wahl">
          <input type="radio" name="richtung" value="nach-de" checked />
          <span>Englisch → Deutsch</span>
        </label>
        <label class="richtung__wahl">
          <input type="radio" name="richtung" value="nach-en" />
          <span>Deutsch → Englisch</span>
        </label>
      </fieldset>

      <!-- Die Startseite: erst wird gewählt, dann geübt. Der Modus steht
           als data-modus am Knopf; ui.js reicht ihn nur nach oben weiter. -->
      <section id="start" class="karte">
        <p class="frage">Was möchtest du machen?</p>
        <div class="wahl">
          <button class="knopf knopf--wahl" type="button" data-modus="uebungsblatt">
            Übungsblatt
            <span class="knopf__dazu">mit Tipps und zweitem Versuch</span>
          </button>
          <button class="knopf knopf--wahl" type="button" data-modus="arbeit">
            Arbeit
            <span class="knopf__dazu">ohne Tipps, ein Versuch</span>
          </button>
        </div>
      </section>

      <!-- Die Karte: sichtbar, solange noch Vokabeln übrig sind -->
      <section id="karte" class="karte" aria-labelledby="frage" hidden>
        <p id="zaehler" class="zaehler"></p>

        <p id="frage" class="frage"></p>
        <p id="beiwort" class="beiwort" hidden></p>

        <!-- Die drei Formen. Nur bei unregelmäßigen Verben sichtbar;
             eine davon ist die Lücke, die getippt werden soll. -->
        <dl id="formen" class="formen" hidden>
          <div><dt>infinitive</dt><dd id="form-infinitive"></dd></div>
          <div><dt>simple past</dt><dd id="form-simple-past"></dd></div>
          <div><dt>past participle</dt><dd id="form-past-participle"></dd></div>
        </dl>

        <form id="antwort-formular" class="formular">
          <label class="label" for="eingabe" id="eingabe-label"></label>
          <input
            id="eingabe"
            class="eingabe"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
          />
          <button id="knopf" class="knopf" type="submit">Prüfen</button>
        </form>

        <button id="tipp-knopf" class="knopf-leise" type="button">
          Tipp anzeigen
        </button>
        <p id="tipp" class="tipp" hidden></p>

        <!-- aria-live sorgt dafür, dass Vorlesesoftware die Rückmeldung ansagt -->
        <p id="rueckmeldung" class="rueckmeldung" role="status" aria-live="polite"></p>

        <!-- Das richtige Wort, groß. Kommt nur, wenn die Antwort falsch war:
             dann ist es das Einzige, was man sich noch merken kann. -->
        <p id="loesung" class="loesung" hidden></p>
      </section>

      <!-- Der Übergang von der Übung in die Wiederholung. Kommt nur im
           Übungsblatt, und nur wenn Karten offen geblieben sind. Bewusst
           ohne Punkte und ohne Note: wer die schon sieht, spielt die
           Wiederholung nicht mehr ernsthaft. -->
      <section id="zwischen" class="karte" hidden>
        <p id="zwischen-titel" class="zwischen-titel"></p>
        <p id="zwischen-text" class="zwischen-text"></p>
        <button id="zwischen-knopf" class="knopf" type="button">
          Weiter üben
        </button>
      </section>

      <!-- Der Abschluss: sichtbar, wenn der Stapel durch ist. Zuerst die
           Note, dann Matildas Text dazu, dann klein die Punkte -- damit man
           sieht, wo die Note herkommt. -->
      <section id="ende" class="karte" hidden>
        <p id="note" class="note"></p>
        <p id="ende-text" class="ende-text"></p>
        <p id="punkte" class="punkte"></p>

        <!-- Was die Lernpotential-Runde gebracht hat. Steht unter den
             Punkten, weil sie die Note nicht mehr verändert. -->
        <p id="lernpotential" class="lernpotential" hidden></p>

        <!-- Zurückschauen: die Liste steht erst da, wenn man sie sehen will.
             Nach einer Arbeit ist das der einzige Ort, an dem die richtigen
             Wörter überhaupt auftauchen. -->
        <button id="ergebnisse-knopf" class="knopf-leise" type="button">
          Ergebnisse ansehen
        </button>
        <ol id="ergebnisse" class="ergebnisse" hidden></ol>

        <!-- Kein "nochmal": man wählt wieder, und es geht sofort los. -->
        <div class="wahl">
          <button class="knopf knopf--wahl" type="button" data-modus="uebungsblatt">
            Übungsblatt
          </button>
          <button class="knopf knopf--wahl" type="button" data-modus="arbeit">
            Arbeit
          </button>
        </div>
      </section>

      <!-- Ein Teilchen für die Effekte bei den drei besten Noten: ein
           Konfettischnipsel, ein Funke, die Rakete. Wie es aussieht und
           wohin es fliegt, steht in styles.css. -->
      <template id="teilchen-vorlage">
        <span class="teilchen" aria-hidden="true"></span>
      </template>

      <!-- Eine Zeile der Ergebnisliste. Die Zeile steht hier im HTML und
           nicht in ui.js: dort wird nur noch Text eingesetzt. -->
      <template id="ergebnis-vorlage">
        <li class="ergebnis">
          <span class="ergebnis__zeichen"></span>
          <span class="ergebnis__frage"></span>
          <span class="ergebnis__punkte"></span>
          <span class="ergebnis__loesung"></span>
          <span class="ergebnis__getippt"></span>
        </li>
      </template>
    </main>

    <!-- Die Bühne für die Effekte liegt über allem und nimmt keine Klicks
         an. Sie steht außerhalb von main, damit die Teilchen über die ganze
         Seite fliegen können und nicht in der Karte eingesperrt sind. -->
    <div id="effekt" class="effekt" aria-hidden="true"></div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
