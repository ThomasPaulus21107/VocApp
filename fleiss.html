<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9f5de4" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>"
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vokabeln" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Dein Fleiß</title>
  </head>
  <body class="seite">
    <a href="index.html" class="zurueck">
      <span aria-hidden="true">←</span> Zurück zum Üben
    </a>

    <main class="buehne buehne--seite">
      <h1 class="titel">Dein Fleiß</h1>

      <section id="leer" class="karte" hidden>
        <p class="abschnitt">Noch nichts zu zeigen</p>
        <p class="ende-text">
          Spiel eine Runde, dann steht hier, an welchen Tagen du geübt hast.
        </p>
      </section>

      <section id="inhalt" class="karte" hidden>
        <p class="fortschritt__gross"><span id="serie">0</span> Tage</p>
        <p class="fortschritt__dazu">am Stück geübt</p>

        <!-- Ein Balken je Tag. Hoehe ist die Menge, der gruene Teil sind die
             Treffer -- so steht beides in einem Bild. -->
        <div id="diagramm" class="diagramm" role="img"
             aria-label="Balkendiagramm der letzten 30 Tage"></div>
        <p class="diagramm__achse">
          <span id="von">vor 30 Tagen</span><span id="bis">heute</span>
        </p>

        <dl class="zahlen">
          <div><dt>Geübte Tage</dt><dd><span id="tage">0</span> von 30</dd></div>
          <div><dt>Antworten</dt><dd id="antworten">0</dd></div>
          <div><dt>Trefferquote</dt><dd id="quote">–</dd></div>
          <div><dt>Bester Tag</dt><dd id="bester">–</dd></div>
        </dl>
      </section>
    </main>

    <script type="module" src="/src/fleiss.js"></script>
  </body>
</html>
