# Baut die App bei jedem Push auf main und veroeffentlicht sie auf GitHub Pages.
# Es gibt bewusst keinen gh-pages-Branch: das Build-Ergebnis wandert nie ins Repo.

name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  # Erlaubt zusaetzlich das Ausloesen von Hand im Actions-Tab.
  workflow_dispatch:

# Ohne pages: write und id-token: write bricht der Deploy mit Rechtefehler ab.
permissions:
  contents: read
  pages: write
  id-token: write

# Zwei gleichzeitige Deploys wuerden sich gegenseitig ueberholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installiert exakt nach package-lock.json und aendert sie nicht.
      - run: npm ci

      # Die Supabase-Zugangsdaten gehen als Umgebungsvariablen in den Build --
      # Vite backt alles ein, was mit VITE_ anfaengt. Beide Werte sind
      # oeffentlich gedacht; was schuetzt, ist Row Level Security. Sie stehen
      # trotzdem als Secrets da, damit ein getauschter Schluessel keine
      # Code-Aenderung ist.
      #
      # Fehlt eines von beiden, laeuft die App ohne Server weiter, statt weiss
      # zu bleiben -- siehe src/infra/backend.js.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
