# Baut die App bei jedem Push auf main und veroeffentlicht sie auf GitHub Pages.
# Es gibt bewusst keinen gh-pages-Branch: das Build-Ergebnis wandert nie ins Repo.

name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  # Erlaubt zusaetzlich das Ausloesen von Hand im Actions-Tab.
  workflow_dispatch:

# Ohne pages: write und id-token: write bricht der Deploy mit Rechtefehler ab.
permissions:
  contents: read
  pages: write
  id-token: write

# Zwei gleichzeitige Deploys wuerden sich gegenseitig ueberholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Erst das Schema, dann die App. Andersherum liefe fuer ein paar Sekunden
  # neuer Code gegen eine alte Datenbank -- und das ist genau der Moment, in
  # dem jemand uebt.
  #
  # Schlaegt dieser Job fehl, wird NICHT gebaut und NICHT veroeffentlicht. Das
  # ist Absicht: eine App ohne ihr Schema auszuliefern ist schlimmer, als
  # einen Deploy ausfallen zu lassen.
  migrieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fehlt das Zugangstoken?
        # Ohne diese Pruefung faellt der Job weiter unten mit einer Meldung
        # aus, die nach einem Netzproblem aussieht.
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSWORT: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          test -n "$TOKEN"    || { echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt. Anlegen unter Settings -> Secrets and variables -> Actions."; exit 1; }
          test -n "$PASSWORT" || { echo "::error::Secret SUPABASE_DB_PASSWORD_PROD fehlt. Zu setzen in Supabase unter Project Settings -> Database."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `link` sieht nach einem ueberfluessigen Schritt aus und ist keiner:
      # ohne ihn versucht `db push` eine direkte Verbindung ueber IPv6, und
      # die GitHub-Runner koennen kein IPv6. Der Fehler heisst dann
      # "IPv6 is not supported on your current network".
      #
      # Die Projektkennung ist kein Geheimnis -- sie steht in jeder URL.
      - run: supabase link --project-ref qykacefynfjgpebuazuv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      # Spielt nur ein, was noch nicht drin ist. Gibt es nichts Neues, sagt
      # der Befehl das und ist zufrieden.
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

  bauen:
    needs: migrieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installiert exakt nach package-lock.json und aendert sie nicht.
      - run: npm ci

      # Die Supabase-Zugangsdaten gehen als Umgebungsvariablen in den Build --
      # Vite backt alles ein, was mit VITE_ anfaengt. Beide Werte sind
      # oeffentlich gedacht; was schuetzt, ist Row Level Security. Sie stehen
      # trotzdem als Secrets da, damit ein getauschter Schluessel keine
      # Code-Aenderung ist.
      #
      # Fehlt eines von beiden, laeuft die App ohne Server weiter, statt weiss
      # zu bleiben -- siehe src/infra/backend.js.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
